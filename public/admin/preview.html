<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vorschau – Flynn Bertsch</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

    /* ── Admin-Vorschau-Banner ── */
    #preview-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      font-size: .8rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 12px;
    }
    #preview-banner .badge {
      background: #e0a852;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: .7rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    #preview-banner .left { display: flex; align-items: center; gap: 10px; }
    #preview-banner .right { display: flex; gap: 8px; }
    #preview-banner button {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: .78rem;
      cursor: pointer;
      transition: background .15s;
    }
    #preview-banner button:hover { background: rgba(255,255,255,.2); }
    #preview-banner button.primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    #preview-banner button.primary:hover { opacity: .85; }

    /* ── Offset for banner ── */
    #page-wrap { padding-top: 44px; }

    /* ═══════════════════════════════════════════
       PROJEKT-DETAIL — pd2-* CSS (1:1 vom Haupt-Stylesheet)
       ═══════════════════════════════════════════ */
    :root { --pd2-gap: clamp(8px, 1vw, 14px); }

    .pd2-page {
      background: #fff;
      min-height: 100vh;
      padding: 0 clamp(28px, 2.54vw, 60px) clamp(60px, 8vw, 120px);
    }
    .pd2-nav {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: clamp(16px, 2vw, 28px) 0 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #000;
      text-decoration: none;
      transition: opacity 0.2s;
      line-height: 1;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .pd2-nav:hover { opacity: 0.5; }
    .pd2-nav__icon { font-size: 0.8em; display: inline-flex; align-items: center; line-height: 1; }
    .pd2-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-top: clamp(12px, 1.5vw, 24px);
      line-height: 0.88;
    }
    .pd2-title {
      font-size: clamp(4rem, 11.57vw, 12.5rem);
      font-weight: 700;
      color: #000;
      text-transform: uppercase;
      letter-spacing: -0.06em;
      line-height: 0.88;
      margin: 0;
    }
    .pd2-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: clamp(6px, 0.8vw, 12px);
      flex-shrink: 0;
    }
    .pd2-counter {
      font-size: clamp(4rem, 11.57vw, 12.5rem);
      font-weight: 700;
      line-height: 0.88;
      margin: 0;
      white-space: nowrap;
      letter-spacing: -0.03em;
      color: #000;
      text-align: right;
    }
    .pd2-counter__total { color: rgba(0,0,0,0.5); }
    .pd2-location {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.45);
      text-align: right;
      margin: 0;
    }
    .pd2-prose {
      max-width: 44%;
      margin-top: clamp(20px, 2.5vw, 36px);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      line-height: 1.6;
      color: #000;
    }
    .pd2-prose p { margin: 0; }
    .pd2-prose p + p { margin-top: 0.6rem; }
    .pd2-hero {
      margin-top: clamp(20px, 2.5vw, 40px);
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      background: #e0e0e0;
    }
    .pd2-hero__btn {
      display: block; width: 100%; height: 100%;
      padding: 0; border: 0; background: none; cursor: zoom-in;
    }
    .pd2-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pd2-gallery {
      margin-top: var(--pd2-gap);
      display: flex;
      flex-direction: column;
      gap: var(--pd2-gap);
    }
    .pd2-row { display: grid; gap: var(--pd2-gap); }
    .pd2-row--land2 { grid-template-columns: 1fr 1fr; }
    .pd2-row--land2 .pd2-img { aspect-ratio: 3 / 2; }
    .pd2-row--land1 { grid-template-columns: 1fr; }
    .pd2-row--land1 .pd2-img { aspect-ratio: 16 / 7; }
    .pd2-row--port3 { grid-template-columns: 1fr 1fr 1fr; }
    .pd2-row--port3 .pd2-img { aspect-ratio: 2 / 3; }
    .pd2-img {
      display: block; border: 0; padding: 0;
      overflow: hidden; background: #e0e0e0;
      cursor: zoom-in; width: 100%;
    }
    .pd2-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s ease;
    }
    .pd2-img:hover img { transform: scale(1.02); }
    .pd2-video {
      width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000;
    }
    .pd2-video video { width: 100%; height: 100%; object-fit: cover; }
    .pd2-video--portrait {
      aspect-ratio: 9 / 16; max-width: 480px; margin-inline: auto;
    }
    .pd2-video-yt { width: 100%; aspect-ratio: 16/9; background: #111; }
    .pd2-video-yt iframe { width: 100%; height: 100%; border: 0; }

    /* Lightbox */
    .pd2-lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .pd2-lightbox.is-open { opacity: 1; pointer-events: all; }
    .pd2-lightbox__img { max-width: 92vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .pd2-lightbox__close {
      position: absolute; top: 1.25rem; right: 1.5rem;
      font-size: 1.5rem; color: #fff; background: none; border: 0;
      cursor: pointer; opacity: .6; transition: opacity .2s;
    }
    .pd2-lightbox__close:hover { opacity: 1; }
    .pd2-lightbox__nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 2rem; color: #fff; background: none; border: 0;
      cursor: pointer; opacity: .5; transition: opacity .2s;
      padding: 1rem 1.25rem; line-height: 1; user-select: none;
    }
    .pd2-lightbox__nav:hover { opacity: 1; }
    .pd2-lightbox__prev { left: .5rem; }
    .pd2-lightbox__next { right: .5rem; }

    /* Responsive */
    @media (max-width: 767px) {
      .pd2-title, .pd2-counter { font-size: clamp(3rem, 15vw, 5rem); }
      .pd2-prose { max-width: 100%; }
      .pd2-row--port3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .pd2-row--land2, .pd2-row--port3 { grid-template-columns: 1fr; }
      .pd2-row--land2 .pd2-img, .pd2-row--port3 .pd2-img { aspect-ratio: 4 / 3; }
    }

    /* No-data fallback */
    .no-data {
      display: flex; align-items: center; justify-content: center;
      min-height: 80vh; flex-direction: column; gap: 16px;
      color: #aaa; font-family: -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<!-- Banner -->
<div id="preview-banner">
  <div class="left">
    <span class="badge">Vorschau</span>
    <span id="banner-title">Lokale Vorschau</span>
  </div>
  <div class="right">
    <button onclick="window.close()">✕ Schließen</button>
    <button class="primary" id="btn-banner-publish">⬆ Veröffentlichen</button>
  </div>
</div>

<div id="page-wrap">
  <div id="content"></div>
</div>

<!-- Lightbox -->
<div class="pd2-lightbox" id="pdLightbox">
  <button class="pd2-lightbox__close" id="pdLightboxClose">✕</button>
  <button class="pd2-lightbox__nav pd2-lightbox__prev" id="pdLightboxPrev">&#10094;</button>
  <button class="pd2-lightbox__nav pd2-lightbox__next" id="pdLightboxNext">&#10095;</button>
  <img class="pd2-lightbox__img" id="pdLightboxImg" src="" alt="">
</div>

<script>
// ── Resolve image path → displayable URL ─────────────────────────────────────
// For locally uploaded images (paths like /uploads/projekte/…) the admin page
// stores data URLs in window.opener._blobCache and blob URLs in
// window.opener._displayCache. We prefer displayCache (AVIF-safe blob URLs)
// but fall back to blobCache (data URLs), then to the actual network path.
function resolveImg(src) {
  if (!src) return '';
  if (src.startsWith('data:') || src.startsWith('blob:')) return src;
  try {
    if (window.opener && !window.opener.closed) {
      const dc = window.opener._displayCache;
      const bc = window.opener._blobCache;
      if (dc && dc[src]) return dc[src];
      if (bc && bc[src]) return bc[src];
    }
  } catch (e) { /* cross-origin — ignore */ }
  return src;
}

// ── Read project data from sessionStorage ────────────────────────────────────
const raw = sessionStorage.getItem('admin_preview');
if (!raw) {
  document.getElementById('content').innerHTML =
    '<div class="no-data"><div style="font-size:2rem">🔍</div><p>Keine Vorschau-Daten gefunden.<br>Bitte öffne die Vorschau über den Admin-Editor.</p></div>';
} else {
  const p = JSON.parse(raw);
  renderPreview(p);
}

function ytId(url) {
  const m = url.match(/(?:v=|youtu\.be\/)([^&?/]+)/);
  return m ? m[1] : null;
}

function renderPreview(p) {
  document.title = (p.title || 'Vorschau') + ' – Flynn Bertsch';
  document.getElementById('banner-title').textContent = p.title || '(ohne Titel)';

  // Publish button goes back to admin and triggers publish
  document.getElementById('btn-banner-publish').addEventListener('click', () => {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'admin_publish' }, '*');
      window.close();
    } else {
      alert('Bitte veröffentliche das Projekt im Admin-Editor.');
    }
  });

  // Gallery layout: alternating land2/port3
  const gallery = p.gallery || [];
  const galleryRows = [];
  let cursor = 0, rowIndex = 0;
  while (cursor < gallery.length) {
    if (rowIndex % 2 === 0) {
      const imgs = gallery.slice(cursor, cursor + 2);
      galleryRows.push({ type: imgs.length === 1 ? 'land1' : 'land2', images: imgs });
      cursor += imgs.length;
    } else {
      const imgs = gallery.slice(cursor, cursor + 3);
      galleryRows.push({ type: 'port3', images: imgs });
      cursor += imgs.length;
    }
    rowIndex++;
  }

  // Collect all lightbox images (cover first, then gallery) — resolve local uploads
  const allImgSrcs = [];
  if (p.cover) allImgSrcs.push(resolveImg(p.cover));
  gallery.forEach(g => allImgSrcs.push(resolveImg(g.image)));

  let html = `<div class="pd2-page">`;

  // Back nav
  html += `<button class="pd2-nav" onclick="window.close()"><span class="pd2-nav__icon">◄</span><span>Zurück</span></button>`;

  // Header
  html += `<div class="pd2-header">
    <h1 class="pd2-title">${esc(p.title || '')}</h1>
    <div class="pd2-header-right">
      <p class="pd2-counter"><span>${String(p.order || 1).padStart(2,'0')}/</span><span class="pd2-counter__total">??</span></p>
      ${p.location ? `<p class="pd2-location">${esc(p.location)}</p>` : ''}
    </div>
  </div>`;

  // Prose / description
  const bodyText = (p._body || '').trim();
  const desc     = (p.description || '').trim();
  if (bodyText) {
    html += `<div class="pd2-prose">${md2html(bodyText)}</div>`;
  } else if (desc) {
    html += `<div class="pd2-prose"><p>${esc(desc)}</p></div>`;
  }

  // Cover
  if (p.cover) {
    const coverIdx = 0;
    html += `<div class="pd2-hero">
      <button class="pd2-img pd2-hero__btn" type="button" data-lightbox="${coverIdx}">
        <img src="${esc(resolveImg(p.cover))}" alt="${esc(p.title || '')}" style="object-position:${esc(p.cover_focal || 'center')}">
      </button>
    </div>`;
  }

  // Gallery
  if (galleryRows.length > 0) {
    html += `<div class="pd2-gallery">`;
    galleryRows.forEach(row => {
      html += `<div class="pd2-row pd2-row--${row.type}">`;
      row.images.forEach(item => {
        const resolved = resolveImg(item.image);
        const lbIdx = allImgSrcs.indexOf(resolved);
        html += `<button class="pd2-img" type="button" data-lightbox="${lbIdx}">
          <img src="${esc(resolved)}" alt="" loading="lazy" style="object-position:${esc(item.focal || '50% 50%')}">
        </button>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  // Videos landscape
  if ((p.videos || []).length > 0) {
    html += `<div class="pd2-gallery">`;
    p.videos.forEach(src => {
      html += `<div class="pd2-video"><video src="${esc(src)}" controls playsinline></video></div>`;
    });
    html += `</div>`;
  }

  // Videos portrait
  if ((p.videos_portrait || []).length > 0) {
    html += `<div class="pd2-row pd2-row--port3" style="margin-top:var(--pd2-gap)">`;
    p.videos_portrait.forEach(src => {
      html += `<div class="pd2-video pd2-video--portrait"><video src="${esc(src)}" controls playsinline></video></div>`;
    });
    html += `</div>`;
  }

  // YouTube
  if ((p.youtube || []).length > 0) {
    html += `<div class="pd2-gallery">`;
    p.youtube.forEach(url => {
      const id = ytId(url);
      if (id) {
        html += `<div class="pd2-video pd2-video-yt">
          <iframe src="https://www.youtube-nocookie.com/embed/${id}" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>
        </div>`;
      }
    });
    html += `</div>`;
  }

  html += `</div>`;
  document.getElementById('content').innerHTML = html;

  // Lightbox
  const imgBtns = Array.from(document.querySelectorAll('button[data-lightbox]'));
  const lightbox = document.getElementById('pdLightbox');
  const lbImg    = document.getElementById('pdLightboxImg');
  let currentIdx = 0;

  function openLb(idx) {
    currentIdx = idx;
    lbImg.src  = allImgSrcs[idx] || '';
    lightbox.classList.add('is-open');
    const show = allImgSrcs.length > 1;
    document.getElementById('pdLightboxPrev').style.display = show ? '' : 'none';
    document.getElementById('pdLightboxNext').style.display = show ? '' : 'none';
  }
  function closeLb() { lightbox.classList.remove('is-open'); }
  function prev() { currentIdx = (currentIdx - 1 + allImgSrcs.length) % allImgSrcs.length; lbImg.src = allImgSrcs[currentIdx]; }
  function next() { currentIdx = (currentIdx + 1) % allImgSrcs.length;                     lbImg.src = allImgSrcs[currentIdx]; }

  imgBtns.forEach(btn => btn.addEventListener('click', () => openLb(parseInt(btn.dataset.lightbox))));
  document.getElementById('pdLightboxClose').addEventListener('click', closeLb);
  document.getElementById('pdLightboxPrev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  document.getElementById('pdLightboxNext').addEventListener('click', e => { e.stopPropagation(); next(); });
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'ArrowLeft')  prev();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'Escape')     closeLb();
  });
}

// Minimal markdown → HTML (bold, italic, paragraphs)
function md2html(text) {
  return text.split(/\n\n+/).map(para =>
    '<p>' + para.trim()
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>') + '</p>'
  ).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
