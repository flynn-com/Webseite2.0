# ----------------------------------------------------------------------------------
# Decap CMS Konfiguration
# ----------------------------------------------------------------------------------

backend:
  name: github
  repo: flynn-com/Webseite2.0
  branch: main
  base_url: https://portfolio-oauth.flynn-fdc.workers.dev
  auth_endpoint: /auth

publish_mode: editorial_workflow

# Medien global — alle Projekt-Uploads in einem Ordner
media_folder: "public/uploads/projekte"
public_folder: "/uploads/projekte"

# Anzeige im CMS
site_url: "https://flynnbertsch.com"
display_url: "https://flynnbertsch.com"
locale: "de"

collections:

  # ──────────────────────────────────────────
  # EINSTELLUNGEN
  # ──────────────────────────────────────────
  - name: "settings"
    label: "Einstellungen"
    files:

      - name: "page_routes"
        label: "Seiten-URLs"
        file: "src/data/page-routes.json"
        format: json
        editor:
          preview: false
        fields:
          - name: "de"
            label: "Deutsch — URL-Slugs"
            widget: "object"
            hint: "Nur Kleinbuchstaben, Zahlen und Bindestriche. Kein / davor oder danach."
            fields:
              - { name: "about",    label: "Über-mich-Seite",    widget: "string", default: "ueber-mich",  hint: "z.B. ueber-mich oder flynn" }
              - { name: "projects", label: "Projekte-Übersicht",  widget: "string", default: "projekte",    hint: "z.B. projekte oder portfolio" }
              - { name: "imprint",  label: "Impressum",           widget: "string", default: "impressum" }
              - { name: "privacy",  label: "Datenschutz",         widget: "string", default: "datenschutz" }
              - { name: "contact",  label: "Kontakt",             widget: "string", default: "kontakt" }
          - name: "en"
            label: "Englisch — URL-Slugs"
            widget: "object"
            hint: "Lowercase letters, numbers and hyphens only."
            fields:
              - { name: "about",    label: "About page",     widget: "string", default: "about" }
              - { name: "projects", label: "Projects index",  widget: "string", default: "projects" }
              - { name: "imprint",  label: "Imprint",         widget: "string", default: "imprint" }
              - { name: "privacy",  label: "Privacy",         widget: "string", default: "privacy" }
              - { name: "contact",  label: "Contact",         widget: "string", default: "contact" }

  # ──────────────────────────────────────────
  # SEITENINHALTE (Singleton-Dateien)
  # ──────────────────────────────────────────
  - name: "pages"
    label: "Seiteninhalte"
    files:

      - name: "about_de"
        label: "Über mich (Deutsch)"
        file: "src/content/about/de.md"
        media_folder: "/public/uploads/about"
        public_folder: "/uploads/about"
        editor:
          preview: false
        fields:
          - name: "photo"
            label: "Profilbild"
            widget: "image"
            hint: "Portrait-Format empfohlen (2:3). AVIF oder JPG, max. 5 MB."
          - name: "photo_focal"
            label: "Profilbild — Fokuspunkt"
            widget: "focal-picker"
            required: false
            default: "50% 50%"
            image_field: "photo"
            hint: "Klicke auf das Bild um den Fokuspunkt zu setzen"
          - name: "subtitle"
            label: "Berufsbezeichnung (erscheint unter dem Namen)"
            widget: "string"
            default: "Fotograf & Videograf & Designer"
          - name: "skills"
            label: "Skills (schwarze Pill-Buttons)"
            widget: "list"
            required: false
            hint: "Z.B. Fotografie, Videografie, Design, Webdesign — jeder Eintrag wird ein Pill"
            field: { name: "skill", label: "Skill", widget: "string" }
          - name: "body"
            label: "Über-mich-Text"
            widget: "markdown"
            hint: "Dieser Text erscheint neben dem Foto. 3–5 kurze Absätze empfohlen."

      - name: "contact_de"
        label: "Kontaktseite (Deutsch)"
        file: "src/content/contact/de.md"
        editor:
          preview: false
        fields:
          - name: "subtitle"
            label: "Untertitel (unter dem Heading)"
            widget: "string"
            default: "Lass uns zusammenarbeiten."
            hint: "z.B. 'Lass uns zusammenarbeiten.' oder 'Ich freue mich auf deine Nachricht.'"
          - name: "email"
            label: "E-Mail-Adresse"
            widget: "string"
            hint: "Wird als anklickbarer Link angezeigt"
          - name: "links"
            label: "Links (Social Media, Website, …)"
            widget: "list"
            required: false
            hint: "Jeder Eintrag erscheint als Link mit ↗ am Ende"
            summary: "{{fields.label}}"
            fields:
              - { name: "label", label: "Bezeichnung", widget: "string", hint: "z.B. Instagram, LinkedIn, Behance" }
              - { name: "url",   label: "URL",          widget: "string", hint: "Vollständige URL inkl. https://" }

      - name: "contact_en"
        label: "Contact page (English)"
        file: "src/content/contact/en.md"
        editor:
          preview: false
        fields:
          - name: "subtitle"
            label: "Subtitle (below heading)"
            widget: "string"
            default: "Let's work together."
          - name: "email"
            label: "Email address"
            widget: "string"
          - name: "links"
            label: "Links (social media, website, …)"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { name: "label", label: "Label", widget: "string" }
              - { name: "url",   label: "URL",   widget: "string" }

      # ── IMPRESSUM ──
      - name: "imprint_de"
        label: "Impressum (Deutsch)"
        file: "src/content/imprint/de.md"
        editor:
          preview: false
        fields:
          - name: "body"
            label: "Impressum-Text"
            widget: "markdown"
            hint: "## für Abschnittsüberschriften verwenden, darunter normaler Text."

      - name: "imprint_en"
        label: "Imprint (English)"
        file: "src/content/imprint/en.md"
        editor:
          preview: false
        fields:
          - name: "body"
            label: "Imprint text"
            widget: "markdown"
            hint: "Use ## for section headings, followed by regular text."

      # ── DATENSCHUTZ ──
      - name: "privacy_de"
        label: "Datenschutzerklärung (Deutsch)"
        file: "src/content/privacy/de.md"
        editor:
          preview: false
        fields:
          - name: "body"
            label: "Datenschutz-Text"
            widget: "markdown"
            hint: "## für Abschnittsüberschriften verwenden, darunter normaler Text."

      - name: "privacy_en"
        label: "Privacy policy (English)"
        file: "src/content/privacy/en.md"
        editor:
          preview: false
        fields:
          - name: "body"
            label: "Privacy policy text"
            widget: "markdown"
            hint: "Use ## for section headings, followed by regular text."

  # ──────────────────────────────────────────
  # PROJEKTE
  # ──────────────────────────────────────────

  # ---------------- DEUTSCH ----------------
  - name: "projects_de"
    label: "Projekte (Deutsch)"
    folder: "src/content/projects/de"
    create: true
    slug: "{{slug}}"
    preview_path: "projekte/{{slug}}"
    media_folder: "public/uploads/projekte/{{slug}}"
    public_folder: "/uploads/projekte/{{slug}}"
    editor:
      preview: false

    # ── SCHRITT 1: Grunddaten (zuerst ausfüllen & speichern!) ──────────────────
    fields:
      - name: "title"
        label: "① Projekttitel"
        widget: "string"
        hint: "Name des Projekts, erscheint als Überschrift"
      - name: "slug"
        label: "② URL-Slug"
        widget: "string"
        hint: "⚠️ Zuerst festlegen — bestimmt den Bild-Upload-Ordner. Nur Kleinbuchstaben & Bindestriche. z.B. portrait-studio"
      - name: "category"
        label: "③ Kategorie"
        widget: "select"
        options:
          - { label: "Fotografie", value: "fotografie" }
          - { label: "Video", value: "video" }
          - { label: "Webdesign", value: "webdesign" }
          - { label: "Design", value: "design" }

    # ── SCHRITT 2: Titelbild ───────────────────────────────────────────────────
      - name: "cover"
        label: "④ Titelbild"
        widget: "image"
        hint: "Empfohlen: AVIF, 2400px, Qualität 80% — erscheint immer als erstes"
      - name: "cover_focal"
        label: "   Titelbild — Fokuspunkt"
        widget: "focal-picker"
        required: false
        default: "50% 50%"
        image_field: "cover"
        hint: "Klicke auf das Bild um den Fokuspunkt zu setzen"

    # ── SCHRITT 3: Weitere Medien ──────────────────────────────────────────────
      - name: "gallery"
        label: "⑤ Weitere Bilder"
        widget: "gallery-focal"
        required: false
        hint: "Mehrere Bilder auf einmal hochladen · Reihenfolge per Drag-and-Drop · Fokuspunkt per Klick"
      - name: "youtube"
        label: "⑥ YouTube-Links"
        widget: "list"
        required: false
        summary: "{{fields.url}}"
        field: { name: "url", label: "YouTube-URL", widget: "string", pattern: ['^https?://(www\.)?(youtube\.com|youtu\.be)/.+', 'Bitte eine gültige YouTube-URL eingeben'] }
      - name: "videos"
        label: "⑥ Eigene Videos Querformat (16:9, max. 20 MB, MP4)"
        hint: "Größere Videos bitte als YouTube-Link einbinden"
        widget: "list"
        required: false
        field: { name: "file", label: "Videodatei", widget: "file", allow_multiple: true }
      - name: "videos_portrait"
        label: "⑥ Eigene Videos Hochkant (9:16, max. 20 MB, MP4)"
        hint: "Reels, TikToks, vertikale Clips"
        widget: "list"
        required: false
        field: { name: "file", label: "Videodatei", widget: "file", allow_multiple: true }

    # ── SCHRITT 4: Texte & Details ────────────────────────────────────────────
      - name: "description"
        label: "⑦ Kurzbeschreibung (1–2 Sätze)"
        widget: "text"
        required: false
      - name: "location"
        label: "   Ort / Stadt"
        widget: "string"
        required: false
        hint: "z.B. München, Stuttgart — erscheint im Glas-Panel"
      - name: "body"
        label: "   Fließtext (Markdown)"
        widget: "markdown"
        required: false
      - name: "tags"
        label: "   Tags"
        widget: "list"
        required: false
        field: { name: "tag", label: "Tag", widget: "string" }

    # ── SCHRITT 5: Sichtbarkeit ───────────────────────────────────────────────
      - name: "visible"
        label: "⑧ Auf der Webseite sichtbar"
        widget: "boolean"
        default: false
        hint: "❌ AUS = Seite existiert auf GitHub, aber taucht in keiner Liste auf (Admin-Review-Phase). ✅ AN = erscheint in Projektliste und Startseite."
      - name: "featured"
        label: "   Auch auf der Startseite zeigen"
        widget: "boolean"
        default: false
        hint: "Nur relevant wenn 'Auf der Webseite sichtbar' aktiv ist"
      - name: "order"
        label: "   Reihenfolge in der Projektliste"
        widget: "number"
        default: 99
        value_type: "int"
        min: 1
        hint: "1 = ganz oben, 2 = zweite Position usw."

  # ---------------- ENGLISCH ----------------
  - name: "projects_en"
    label: "Projects (English)"
    folder: "src/content/projects/en"
    create: true
    slug: "{{slug}}"
    preview_path: "en/projects/{{slug}}"
    media_folder: "public/uploads/projekte/{{slug}}"
    public_folder: "/uploads/projekte/{{slug}}"
    editor:
      preview: false

    # ── STEP 1: Basic data (fill in & save first!) ────────────────────────────
    fields:
      - name: "title"
        label: "① Project title"
        widget: "string"
      - name: "slug"
        label: "② URL slug"
        widget: "string"
        hint: "⚠️ Set this first — determines the image upload folder. Lowercase & hyphens only. e.g. portrait-studio"
      - name: "category"
        label: "③ Category"
        widget: "select"
        options:
          - { label: "Photography", value: "fotografie" }
          - { label: "Video", value: "video" }
          - { label: "Web design", value: "webdesign" }
          - { label: "Design", value: "design" }

    # ── STEP 2: Cover image ───────────────────────────────────────────────────
      - name: "cover"
        label: "④ Cover image"
        widget: "image"
        hint: "Recommended: AVIF, 2400px, quality 80% — always shown first"
      - name: "cover_focal"
        label: "   Cover image — focal point"
        widget: "focal-picker"
        required: false
        default: "50% 50%"
        image_field: "cover"
        hint: "Click on the image to set the focal point"

    # ── STEP 3: Media ─────────────────────────────────────────────────────────
      - name: "gallery"
        label: "⑤ Additional images"
        widget: "gallery-focal"
        required: false
        hint: "Upload multiple images at once · drag to reorder · click to set focal point"
      - name: "youtube"
        label: "⑥ YouTube links"
        widget: "list"
        required: false
        field: { name: "url", label: "YouTube URL", widget: "string" }
      - name: "videos"
        label: "⑥ Local videos landscape (16:9, max 20 MB, MP4)"
        widget: "list"
        required: false
        field: { name: "file", label: "Video file", widget: "file", allow_multiple: true }
      - name: "videos_portrait"
        label: "⑥ Local videos portrait (9:16, max 20 MB, MP4)"
        hint: "Reels, TikToks, vertical clips"
        widget: "list"
        required: false
        field: { name: "file", label: "Video file", widget: "file", allow_multiple: true }

    # ── STEP 4: Text & details ────────────────────────────────────────────────
      - name: "description"
        label: "⑦ Short description (1–2 sentences)"
        widget: "text"
        required: false
      - name: "location"
        label: "   Location / City"
        widget: "string"
        required: false
        hint: "e.g. Munich, Stuttgart — shown in the glass panel"
      - name: "body"
        label: "   Body text (Markdown)"
        widget: "markdown"
        required: false
      - name: "tags"
        label: "   Tags"
        widget: "list"
        required: false
        field: { name: "tag", label: "Tag", widget: "string" }

    # ── STEP 5: Visibility ────────────────────────────────────────────────────
      - name: "visible"
        label: "⑧ Visible on website"
        widget: "boolean"
        default: false
        hint: "❌ OFF = page exists on GitHub but not shown in any list (admin review phase). ✅ ON = appears in project list and homepage."
      - name: "featured"
        label: "   Also show on homepage"
        widget: "boolean"
        default: false
        hint: "Only relevant when 'Visible on website' is active"
      - name: "order"
        label: "   Order in project list"
        widget: "number"
        default: 99
        value_type: "int"
        min: 1
        hint: "1 = top, 2 = second position, etc."
