name = "admin-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# ── KV Namespace ──────────────────────────────────────────────────────────────
# Nach `wrangler kv:namespace create ADMIN_KV` die zurückgegebene ID eintragen:
[[kv_namespaces]]
binding = "ADMIN_KV"
id      = "83cdf3882590411b87bb3529e89858b4"

# ── Routes ────────────────────────────────────────────────────────────────────
# Der Worker läuft auf einer eigenen subdomain (workers.dev)
# Optional: Custom Route auf flynnbertsch.com konfigurieren

# ── Secrets (via `wrangler secret put <NAME>`) ────────────────────────────────
# GITHUB_TOKEN     — GitHub Personal Access Token (Scope: repo)
# RESEND_API_KEY   — Resend API Key
# ADMIN_EMAIL      — E-Mail-Adresse für Passwort-Reset-Mails
# ALLOWED_ORIGIN   — https://flynnbertsch.com

# ── Kundenauswahl ─────────────────────────────────────────────────────────────
# Einmalig anlegen (siehe README "Kundenauswahl"):
#   npx wrangler d1 create auswahl          → database_id hier eintragen
#   npx wrangler r2 bucket create auswahl-images
#   npx wrangler d1 execute auswahl --remote --file=schema.sql
[[d1_databases]]
binding       = "GALLERY_DB"
database_name = "auswahl"
database_id   = "HIER_DATABASE_ID_EINTRAGEN"

[[r2_buckets]]
binding     = "GALLERY_R2"
bucket_name = "auswahl-images"
